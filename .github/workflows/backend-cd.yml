name: Backend CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'deploy.sh'
      - 'deploy/**'
      - '.github/workflows/backend-cd.yml'

jobs:
  deploy:
    runs-on: self-hosted
    
    # Optional: You can make this job wait for the 'Backend CI' workflow by using workflow_run,
    # but for simplicity it will just run when changes are pushed to main.
    
    steps:
    - name: Deploy to GCP VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /opt/c2-app/C2-App-060
          bash deploy.sh
