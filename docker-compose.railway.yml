# Mo phong cau hinh 2 service tren Railway (backend + frontend rieng).
# Chay local: docker compose -f docker-compose.railway.yml up -d --build

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      PORT: "8000"
      DATABASE_URL: sqlite:///./data/app.db
      CHROMA_PATH: ./data/chroma
      UPLOAD_DIR: ./data/uploads
      RAG_CHROMA_PATH: ./data/rag_chroma
      RAG_BM25_PATH: ./data/rag/bm25_index.pkl
      RAG_CHUNKS_PATH: ./data/rag/chunks.pkl
      GROUP_DOCS_DIR: ./data/group_docs
      HF_HOME: ./data/huggingface
      TRANSFORMERS_CACHE: ./data/huggingface
      SENTENCE_TRANSFORMERS_HOME: ./data/huggingface
      MODEL_WARMUP_ENABLED: "false"
      CORS_ALLOW_ALL: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-in-production}

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_BACKEND_DIRECT_URL: ${NEXT_PUBLIC_BACKEND_DIRECT_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
