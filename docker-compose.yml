services:
  backend:
    build: ./backend
    container_name: dinov2-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - CHROMA_PATH=./data/chroma
      - UPLOAD_DIR=./uploads
      - SIMILARITY_THRESHOLD=0.75
      - SEARCH_TOP_K=20
      - SEARCH_TOP_N=3
      - USE_AUGMENTATION=true
      - CORS_ALLOW_ALL=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - RAG_CHROMA_PATH=./data/rag_chroma
      - RAG_BM25_PATH=./data/rag/bm25_index.pkl
      - RAG_CHUNKS_PATH=./data/rag/chunks.pkl
      - MODEL_WARMUP_ENABLED=false
      - ADMIN_AUTH_ENABLED=${ADMIN_AUTH_ENABLED:-false}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

  frontend:
    build: ./frontend
    container_name: dinov2-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  # Tùy chọn: Cloudflare Tunnel (cần TUNNEL_TOKEN từ Cloudflare Zero Trust)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dinov2-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  backend_data:
  backend_uploads:
