      <stop offset="0" stop-color="#ead9b5"/>
      <stop offset="1" stop-color="#c9aa72"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#5e4528" opacity=".09"/>
      <circle cx="18" cy="17" r="1.2" fill="#5e4528" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="720" height="1080" rx="36" fill="url(#paper)"/>
