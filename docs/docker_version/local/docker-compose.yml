services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      PORT: 8000
      HF_HOME: ./data/huggingface
      TRANSFORMERS_CACHE: ./data/huggingface
      SENTENCE_TRANSFORMERS_HOME: ./data/huggingface
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
