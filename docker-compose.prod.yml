services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CHROMA_PATH: ./data/chroma
      UPLOAD_DIR: ./data/uploads
      RAG_CHROMA_PATH: ./data/rag_chroma
      RAG_BM25_PATH: ./data/rag/bm25_index.pkl
      RAG_CHUNKS_PATH: ./data/rag/chunks.pkl
      GROUP_DOCS_DIR: ./data/group_docs
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.75}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-20}
      SEARCH_TOP_N: ${SEARCH_TOP_N:-3}
      USE_AUGMENTATION: ${USE_AUGMENTATION:-true}
      HF_HOME: ./data/huggingface
      TRANSFORMERS_CACHE: ./data/huggingface
      SENTENCE_TRANSFORMERS_HOME: ./data/huggingface
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_ALL: "false"
      MODEL_WARMUP_ENABLED: ${MODEL_WARMUP_ENABLED:-false}
      CONTENT_PREWARM_ENABLED: ${CONTENT_PREWARM_ENABLED:-false}
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/data/chroma
      - rag_chroma_data:/app/data/rag_chroma
      - rag_data:/app/data/rag
      - group_docs_data:/app/data/group_docs
      - hf_cache:/app/data/huggingface
      - ./docs/reports:/app/docs/reports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
  rag_chroma_data:
  rag_data:
  group_docs_data:
  hf_cache:
  caddy_data:
  caddy_config:
