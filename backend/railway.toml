[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["app/**", "requirements.txt", "Dockerfile"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Gan volume persistent tren Railway UI: mount /app/data
# Dat UPLOAD_DIR=./data/uploads de SQLite + uploads + RAG cung nam tren volume.
